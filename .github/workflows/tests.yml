name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Locked installation and offline tests
        run: |
          uv sync --locked --extra dev --python '${{ matrix.python-version }}'
          uv run --locked --no-sync python -m pytest
      - name: Build source distribution and wheel
        run: uv build
      - name: Isolated wheel smoke test outside checkout
        run: |
          uv venv "$RUNNER_TEMP/media-intake-smoke" --python '${{ matrix.python-version }}'
          uv pip install --python "$RUNNER_TEMP/media-intake-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/media-intake-smoke/bin/python" -c 'import media_intake; from media_intake import MediaIntake, YouTubeSource, MediaFormatPolicy, CaptionPolicy'
          "$RUNNER_TEMP/media-intake-smoke/bin/media-intake" --help
          uv pip check --python "$RUNNER_TEMP/media-intake-smoke/bin/python"
